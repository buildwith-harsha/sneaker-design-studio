    <!-- Laces -->
    <g id="laces"  fill="none" stroke="#171717" stroke-width="11" stroke-linecap="round">
      <path id="lace-1" class="sneaker-component" d="M370 250 L505 292" />
      <path id="lace-2" class="sneaker-component" d="M358 270 L493 312" />
      <path id="lace-3" class="sneaker-component" d="M352 291 L482 331" />
      <path id="lace-4" class="sneaker-component" d="M350 311 L465 348" />
